[package]
name = "ontrack"
version = "0.2.2"
edition = "2024"
rust-version = "1.88"
description = "A terminal-first issue tracker for Beads and Herdr"
license = "MIT"

[dependencies]
crossterm = "0.29"
fs2 = "0.4"
ratcn = { version = "0.0.6", features = ["crossterm"] }
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
ratatui-cheese = "0.7.0"
semver = "1"
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["parsing"] }
tui-markdown = { version = "=0.3.11", default-features = false }
